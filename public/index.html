
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO — Chat</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#1b2740;--border:#2b3955;--text:#f5f7ff;--muted:#9caac5;--purple:#9165ff;--mint:#58e6c3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#20204a,var(--bg) 65%);color:var(--text);font-family:system-ui,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:28px;letter-spacing:3px}
.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--mint));color:#07121a;letter-spacing:0}
.muted{color:var(--muted)}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px;padding:20px}
.card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:25px;box-shadow:0 20px 80px #0005}
h1{font-size:25px;margin:0 0 8px}
p{line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0;padding:5px;background:var(--bg);border-radius:12px}
.tab{display:block;width:100%;padding:12px;border:0;border-radius:9px;background:transparent;color:var(--muted)}
.tab.active{background:var(--panel2);color:white}
label{display:block;margin:14px 0 7px;font-size:13px;color:#cbd5ed}
input{width:100%;min-width:0;padding:13px;background:#0b1221;color:white;border:1px solid var(--border);border-radius:11px;outline:none}
input:focus{border-color:var(--purple)}
.primary{background:linear-gradient(100deg,var(--mint),#a4f5db);color:#07131a;font-weight:800;border:0;border-radius:11px;padding:13px}
.primary:disabled{opacity:.6}
.full{width:100%;margin-top:19px}
.notice{min-height:22px;color:#ff9aa9;font-size:13px;margin-top:10px;overflow-wrap:anywhere}
.small{font-size:12px}
#chatScreen{display:none;height:100dvh;padding:12px}
.layout{max-width:1250px;height:100%;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--panel)}
aside{display:flex;flex-direction:column;padding:17px 12px;background:#0d1525;border-right:1px solid var(--border);min-width:0}
.sidebrand{font-size:21px;letter-spacing:2px;margin-bottom:28px}
.sidebrand .logo{width:36px;height:36px;border-radius:12px}
.section{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:0 10px 10px}
.channel{width:100%;text-align:left;padding:12px;border:0;border-radius:10px;background:transparent;color:#cbd4e9;margin:2px 0}
.channel.active,.channel:hover{background:#302650;color:white}
.profile{margin-top:auto;padding-top:15px;border-top:1px solid var(--border);overflow-wrap:anywhere}
.logout{margin-top:12px;background:transparent;border:1px solid var(--border);border-radius:9px;padding:9px;color:white}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
header{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{font-size:18px;margin:0}
.status{font-size:12px;color:var(--mint);margin-top:5px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;line-height:1.6}
.msg{padding:12px 14px;background:var(--panel2);border-radius:13px;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.author{font-size:13px;font-weight:800}
.time{font-size:11px;color:var(--muted)}
.msgtext{white-space:pre-wrap;line-height:1.5}
.composer{padding:14px;border-top:1px solid var(--border)}
.composer form{display:flex;gap:9px}
.composer input{flex:1}
@media(max-width:600px){
#chatScreen{padding:0}
.layout{grid-template-columns:76px minmax(0,1fr);border:0;border-radius:0}
aside{padding:10px 5px}
.sidebrand{justify-content:center}
.sidebrandtext,.section,.channelname,.profileemail{display:none}
.channel{text-align:center;padding:13px 2px;font-size:12px}
.profile{text-align:center}
.logout{font-size:11px;padding:8px 4px}
header{padding:14px 10px}
#messages{padding:12px 8px}
.composer{padding:10px 7px}
.composer .primary{padding:12px 9px}
.card{padding:21px}
}
</style>
</head>
<body>

<section id="authScreen">
  <div class="brand"><span class="logo">N</span><span>NEXO</span></div>
  <div class="card">
    <h1 id="authTitle">Bem-vindo ao NEXO</h1>
    <p id="authSubtitle" class="muted">Entre para conversar com sua comunidade.</p>

    <div class="tabs">
      <button type="button" class="tab active" id="loginTab">Entrar</button>
      <button type="button" class="tab" id="registerTab">Criar conta</button>
    </div>

    <form id="authForm">
      <div id="usernameWrap" class="hidden">
        <label for="username">Nome de usuário</label>
        <input id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="Ex.: usuario_123">
      </div>

      <label id="identifierLabel" for="identifier">E-mail ou usuário</label>
      <input id="identifier" autocomplete="username" required maxlength="254" placeholder="Seu e-mail ou usuário">

      <label for="password">Senha</label>
      <input id="password" type="password" required minlength="10" maxlength="72" autocomplete="current-password" placeholder="Sua senha">

      <button id="submitButton" class="primary full" type="submit">Entrar</button>
      <div id="authError" class="notice" role="status"></div>
    </form>

    <p class="muted small">Use uma senha exclusiva para sua conta NEXO.</p>
  </div>
</section>

<section id="chatScreen">
  <div class="layout">
    <aside>
      <div class="brand sidebrand"><span class="logo">N</span><span class="sidebrandtext">NEXO</span></div>
      <div class="section">CANAIS</div>
      <button class="channel active" data-channel="geral"># <span class="channelname">geral</span></button>
      <button class="channel" data-channel="jogos">🎮 <span class="channelname">jogos</span></button>
      <button class="channel" data-channel="tecnologia">💻 <span class="channelname">tecnologia</span></button>
      <button class="channel" data-channel="conversa">☕ <span class="channelname">conversa</span></button>
      <div class="profile">
        <div id="profileName">Usuário</div>
        <div id="profileEmail" class="profileemail muted small"></div>
        <button id="logoutButton" class="logout">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header>
        <div><h2 id="channelTitle"># geral</h2><div class="status">● Chat NEXO</div></div>
        <span class="muted small">Em tempo real</span>
      </header>

      <div id="messages"><div class="empty muted">Carregando...</div></div>

      <div class="composer">
        <form id="messageForm">
          <input id="messageInput" maxlength="2000" placeholder="Escreva uma mensagem..." required autocomplete="off">
          <button class="primary" type="submit">Enviar</button>
        </form>
        <div id="chatError" class="notice" role="status"></div>
      </div>
    </main>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
let mode = "login";
let socket = null;
let channel = "geral";

function setMode(value) {
  mode = value;
  const registering = value === "register";

  $("loginTab").classList.toggle("active", !registering);
  $("registerTab").classList.toggle("active", registering);
  $("usernameWrap").classList.toggle("hidden", !registering);
  $("username").required = registering;
  $("identifierLabel").textContent = registering ? "E-mail" : "E-mail ou usuário";
  $("identifier").type = registering ? "email" : "text";
  $("identifier").autocomplete = registering ? "email" : "username";
  $("identifier").placeholder = registering ? "voce@exemplo.com" : "Seu e-mail ou usuário";
  $("password").autocomplete = registering ? "new-password" : "current-password";
  $("password").minLength = registering ? 10 : 1;
  $("authTitle").textContent = registering ? "Criar sua conta" : "Bem-vindo ao NEXO";
  $("authSubtitle").textContent = registering ? "Faça parte da comunidade." : "Entre para conversar com sua comunidade.";
  $("submitButton").textContent = registering ? "Criar conta" : "Entrar";
  $("authError").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options,
    headers: {"Content-Type":"application/json", ...(options.headers || {})}
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Ocorreu um erro.");
  return data;
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("submitButton").disabled = true;
  $("authError").textContent = "";

  try {
    const payload = mode === "register"
      ? {
          username: $("username").value.trim(),
          email: $("identifier").value.trim(),
          password: $("password").value
        }
      : {
          identifier: $("identifier").value.trim(),
          password: $("password").value
        };

    const data = await api(mode === "register" ? "/api/register" : "/api/login", {
      method: "POST",
      body: JSON.stringify(payload)
    });

    $("password").value = "";
    enterChat(data.user);
  } catch (error) {
    $("authError").textContent = error.message;
  } finally {
    $("submitButton").disabled = false;
  }
});

function emptyMessages(text) {
  $("messages").replaceChildren();
  const div = document.createElement("div");
  div.className = "empty muted";
  div.textContent = text;
  $("messages").appendChild(div);
}

function addMessage(item) {
  const empty = $("messages").querySelector(".empty");
  if (empty) empty.remove();

  const card = document.createElement("article");
  card.className = "msg";

  const meta = document.createElement("div");
  meta.className = "meta";

  const author = document.createElement("span");
  author.className = "author";
  author.textContent = item.username || "Usuário";

  const time = document.createElement("span");
  time.className = "time";
  const date = new Date(item.created_at);
  time.textContent = Number.isNaN(date.getTime()) ? "" : date.toLocaleString("pt-BR");

  const text = document.createElement("div");
  text.className = "msgtext";
  text.textContent = item.message || "";

  meta.append(author, time);
  card.append(meta, text);
  $("messages").appendChild(card);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function connectChat() {
  if (socket) socket.disconnect();
  socket = io();

  socket.on("connect", () => socket.emit("join channel", channel));
  socket.on("connect_error", () => {
    $("chatError").textContent = "Não foi possível conectar. Confira seu login e a conexão.";
  });

  socket.on("chat history", history => {
    $("messages").replaceChildren();
    if (!history || history.length === 0) {
      emptyMessages("Nenhuma mensagem ainda. Comece a conversa!");
    } else {
      history.forEach(addMessage);
    }
  });

  socket.on("chat message", item => {
    if (item.channel === channel) addMessage(item);
  });

  socket.on("chat error", message => {
    $("chatError").textContent = message;
  });
}

function enterChat(user) {
  $("profileName").textContent = user.username;
  $("profileEmail").textContent = user.email;
  $("authScreen").style.display = "none";
  $("chatScreen").style.display = "block";
  $("chatError").textContent = "";
  emptyMessages("Conectando ao chat...");
  connectChat();
}

document.querySelectorAll(".channel").forEach(button => {
  button.addEventListener("click", () => {
    channel = button.dataset.channel;

    document.querySelectorAll(".channel").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    $("channelTitle").textContent = "# " + channel;
    $("chatError").textContent = "";
    emptyMessages("Carregando mensagens...");

    if (socket && socket.connected) {
      socket.emit("join channel", channel);
    }
  });
});

$("messageForm").addEventListener("submit", event => {
  event.preventDefault();
  const message = $("messageInput").value.trim();
  if (!message) return;

  if (!socket || !socket.connected) {
    $("chatError").textContent = "Aguarde a conexão com o chat.";
    return;
  }

  socket.emit("send message", {channel, message});
  $("messageInput").value = "";
  $("chatError").textContent = "";
});

$("logoutButton").addEventListener("click", async () => {
  try {
    if (socket) {
      socket.disconnect();
      socket = null;
    }

    await api("/api/logout", {method:"POST", body:"{}"});
    $("chatScreen").style.display = "none";
    $("authScreen").style.display = "flex";
    $("identifier").value = "";
    $("password").value = "";
    $("username").value = "";
    setMode("login");
  } catch (error) {
    $("chatError").textContent = error.message;
  }
});

async function init() {
  try {
    const data = await api("/api/me");
    if (data.authenticated && data.user) enterChat(data.user);
  } catch (error) {
    console.error("Não foi possível verificar a sessão.");
  }
}

init();
</script>
</body>
</html>
