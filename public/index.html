
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXO — Converse sem limites</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --panel: #11182a;
      --panel2: #18223a;
      --border: #28344e;
      --text: #f2f5ff;
      --muted: #9ba8c3;
      --purple: #8b5cf6;
      --mint: #54e3c2;
      --danger: #ff7d91;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #1b1c42 0, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--mint));
      color: #08101b;
      font-weight: 900;
      letter-spacing: 0;
    }

    .muted { color: var(--muted); }

    #authScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 28px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 26px;
      background: rgba(17, 24, 42, .94);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 80px #0005;
    }

    h1 { margin: 0 0 8px; font-size: 26px; }
    h2 { font-size: 17px; margin: 0; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 22px 0;
      padding: 5px;
      border-radius: 13px;
      background: var(--bg);
    }

    .tab {
      border: 0;
      border-radius: 9px;
      padding: 11px;
      color: var(--muted);
      background: transparent;
    }

    .tab.active {
      background: var(--panel2);
      color: white;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 13px;
      color: #c6d0e6;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      color: white;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input:focus { border-color: var(--purple); }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 20px;
      font-weight: 750;
      color: #08101b;
      background: linear-gradient(100deg, var(--mint), #a4f5db);
    }

    .primary:disabled { opacity: .6; cursor: wait; }

    .message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .hint { font-size: 12px; line-height: 1.5; }

    #chatScreen {
      display: none;
      min-height: 100vh;
      height: 100dvh;
      padding: 14px;
    }

    .chat-layout {
      max-width: 1200px;
      height: 100%;
      min-height: 0;
      margin: auto;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
    }

    aside {
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      background: #0e1525;
      border-right: 1px solid var(--border);
      min-width: 0;
    }

    .small-brand { font-size: 20px; margin-bottom: 30px; }
    .small-brand .logo { width: 36px; height: 36px; }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      margin: 0 10px 12px;
    }

    .channel {
      width: 100%;
      padding: 12px;
      text-align: left;
      color: #c2cbe0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .channel.active {
      color: white;
      background: #302450;
    }

    .channel:hover { background: var(--panel2); }

    .profile {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      overflow-wrap: anywhere;
    }

    .profile-name { font-weight: 700; margin-bottom: 3px; }

    .logout {
      margin-top: 12px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: #dce3f6;
    }

    .chat-main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 19px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .online {
      font-size: 12px;
      color: var(--mint);
      margin-top: 5px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .empty {
      text-align: center;
      margin: auto;
      max-width: 300px;
      line-height: 1.6;
    }

    .chat-message {
      padding: 13px 15px;
      border-radius: 14px;
      background: var(--panel2);
      overflow-wrap: anywhere;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .message-author { font-size: 13px; font-weight: 800; }
    .message-time { font-size: 11px; color: var(--muted); }
    .message-text { white-space: pre-wrap; line-height: 1.5; }

    .composer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .composer form {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .composer input { flex: 1; min-width: 0; }
    .composer .primary { width: auto; margin: 0; padding: 13px 18px; }

    @media (max-width: 650px) {
      #chatScreen { padding: 0; }
      .chat-layout {
        grid-template-columns: 86px minmax(0, 1fr);
        border-radius: 0;
        border: 0;
        height: 100%;
      }
      aside { padding: 12px 7px; }
      .small-brand {
        justify-content: center;
        margin-bottom: 26px;
      }
      .small-brand .brand-name,
      .section-label,
      .channel-label,
      .profile-name,
      .profile-email,
      .logout-text { display: none; }
      .channel { text-align: center; padding: 13px 3px; font-size: 12px; }
      .profile { text-align: center; }
      .logout { padding: 8px 5px; font-size: 11px; }
      .chat-header { padding: 15px 12px; }
      #messages { padding: 13px 10px; }
      .composer { padding: 12px 9px; }
      .composer .primary { padding: 12px; }
      .auth-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <section id="authScreen">
    <div class="brand">
      <div class="logo">N</div>
      <span>NEXO</span>
    </div>

    <div class="auth-card">
      <h1 id="authTitle">Bem-vindo ao NEXO</h1>
      <p id="authSubtitle" class="muted">Entre para conversar com sua comunidade.</p>

      <div class="tabs">
        <button type="button" class="tab active" id="loginTab">Entrar</button>
        <button type="button" class="tab" id="registerTab">Criar conta</button>
      </div>

      <form id="authForm">
        <div id="usernameField" hidden>
          <label for="username">Nome de usuário</label>
          <input id="username" name="username" autocomplete="username"
                 minlength="3" maxlength="24" placeholder="Ex.: usuario_123">
        </div>

        <div id="emailField">
          <label for="email" id="emailLabel">E-mail ou usuário</label>
          <input id="email" name="email" type="text" autocomplete="username"
                 maxlength="254" placeholder="Seu e-mail ou usuário" required>
        </div>

        <div id="passwordField">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" minlength="10" maxlength="72"
                 placeholder="Sua senha" required>
        </div>

        <button id="submitButton" class="primary" type="submit">Entrar</button>
        <div id="authMessage" class="message" role="status"></div>
      </form>

      <p class="hint muted">
        Use uma senha exclusiva para o NEXO. Nunca compartilhe sua senha.
      </p>
    </div>
  </section>

  <section id="chatScreen">
    <div class="chat-layout">
      <aside>
        <div class="brand small-brand">
          <div class="logo">N</div>
          <span class="brand-name">NEXO</span>
        </div>

        <div class="section-label">CANAIS</div>
        <button class="channel active" data-channel="geral"># <span class="channel-label">geral</span></button>
        <button class="channel" data-channel="jogos">🎮 <span class="channel-label">jogos</span></button>
        <button class="channel" data-channel="tecnologia">💻 <span class="channel-label">tecnologia</span></button>
        <button class="channel" data-channel="conversa">☕ <span class="channel-label">conversa</span></button>

        <div class="profile">
          <div class="profile-name" id="profileName">Usuário</div>
          <div class="profile-email muted" id="profileEmail" style="font-size:11px"></div>
          <button class="logout" id="logoutButton">Sair <span class="logout-text">da conta</span></button>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div>
            <h2 id="channelTitle"># geral</h2>
            <div class="online">● Chat em tempo real</div>
          </div>
          <div class="muted" style="font-size:12px">NEXO</div>
        </header>

        <div id="messages" aria-live="polite">
          <div class="empty muted">Carregando conversa...</div>
        </div>

        <div class="composer">
          <form id="messageForm">
            <input id="messageInput" maxlength="2000"
                   placeholder="Escreva uma mensagem..." autocomplete="off" required>
            <button class="primary" type="submit">Enviar</button>
          </form>
          <div id="chatError" class="message" role="status"></div>
        </div>
      </main>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const authScreen = document.getElementById("authScreen");
    const chatScreen = document.getElementById("chatScreen");
    const authForm = document.getElementById("authForm");
    const authMessage = document.getElementById("authMessage");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const usernameField = document.getElementById("usernameField");
    const emailField = document.getElementById("emailField");
    const emailLabel = document.getElementById("emailLabel");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const messagesBox = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const chatError = document.getElementById("chatError");

    let mode = "login";
    let currentChannel = "geral";
    let socket = null;
    let currentUser = null;

    function setMode(nextMode) {
      mode = nextMode;
      const registering = mode === "register";

      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);
      usernameField.hidden = !registering;
      usernameInput.required = registering;
      emailLabel.textContent = registering ? "E-mail" : "E-mail ou usuário";
      emailInput.type = registering ? "email" : "text";
      emailInput.autocomplete = registering ? "email" : "username";
      emailInput.placeholder = registering ? "voce@exemplo.com" : "Seu e-mail ou usuário";
      passwordInput.autocomplete = registering ? "new-password" : "current-password";
      passwordInput.minLength = registering ? 10 : 1;
      passwordInput.placeholder = registering ? "Crie uma senha forte" : "Sua senha";
      authTitle.textContent = registering ? "Crie sua conta" : "Bem-vindo ao NEXO";
      authSubtitle.textContent = registering
        ? "Entre para fazer parte da comunidade."
        : "Entre para conversar com sua comunidade.";
      submitButton.textContent = registering ? "Criar conta" : "Entrar";
      authMessage.textContent = "";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    async function api(path, options = {}) {
      const response = await fetch(path, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Ocorreu um erro.");
      return data;
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      authMessage.textContent = "";
      submitButton.disabled = true;

      try {
        let data;

        if (mode === "register") {
          data = await api("/api/register", {
            method: "POST",
            body: JSON.stringify({
              username: usernameInput.value.trim(),
              email: emailInput.value.trim(),
              password: passwordInput.value
            })
          });
        } else {
          data = await api("/api/login", {
            method: "POST",
            body: JSON.stringify({
              identifier: emailInput.value.trim(),
              password: passwordInput.value
            })
          });
        }

        passwordInput.value = "";
        await enterChat(data.user);
      } catch (error) {
        authMessage.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    function renderMessage(message) {
      const empty = messagesBox.querySelector(".empty");
      if (empty) empty.remove();

      const card = document.createElement("article");
      card.className = "chat-message";

      const meta = document.createElement("div");
      meta.className = "message-meta";

      const author = document.createElement("span");
      author.className = "message-author";
      author.textContent = message.username || "Usuário";

      const time = document.createElement("span");
      time.className = "message-time";
      const date = new Date(message.created_at);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = message.message || "";

      meta.append(author, time);
      card.append(meta, text);
      messagesBox.appendChild(card);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function showEmpty(text) {
      messagesBox.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty muted";
      empty.textContent = text;
      messagesBox.appendChild(empty);
    }

    function connectChat() {
      if (socket) socket.disconnect();

      socket = io();

      socket.on("connect", () => {
        socket.emit("join channel", currentChannel);
      });

      socket.on("connect_error", () => {
        chatError.textContent = "Conexão não autorizada. Entre novamente na sua conta.";
      });

      socket.on("channel joined", (channel) => {
        currentChannel = channel;
      });

      socket.on("chat history", (history) => {
        messagesBox.replaceChildren();
        if (!history || history.length === 0) {
          showEmpty("Ainda não há mensagens neste canal. Comece a conversa!");
          return;
        }
        history.forEach(renderMessage);
      });

      socket.on("chat message", (message) => {
        if (message.channel === currentChannel) renderMessage(message);
      });

      socket.on("chat error", (message) => {
        chatError.textContent = message;
      });
    }

    async function enterChat(user) {
      currentUser = user;
      document.getElementById("profileName").textContent = user.username;
      document.getElementById("profileEmail").textContent = user.email;
      authScreen.style.display = "none";
      chatScreen.style.display = "block";
      chatError.textContent = "";
      showEmpty("Conectando ao chat...");
      connectChat();
    }

    document.querySelectorAll(".channel").forEach((button) => {
      button.addEventListener("click", () => {
        const channel = button.dataset.channel;
        if (channel === currentChannel) return;

        currentChannel = channel;
        document.querySelectorAll(".channel").forEach((item) => {
          item.classList.toggle("active", item === button);
        });

        document.getElementById("channelTitle").textContent = "# " + channel;
        chatError.textContent = "";
        showEmpty("Carregando mensagens...");

        if (socket && socket.connected) {
          socket.emit("join channel", channel);
        }
      });
    });

    messageForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message || !socket || !socket.connected) {
        chatError.textContent = "Aguarde a conexão com o chat.";
        return;
      }

      socket.emit("send message", {
        channel: currentChannel,
        message
      });

      messageInput.value = "";
      chatError.textContent = "";
      messageInput.focus();
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        if (socket) {
          socket.disconnect();
          socket = null;
        }

        await api("/api/logout", { method: "POST", body: "{}" });
        currentUser = null;
        chatScreen.style.display = "none";
        authScreen.style.display = "flex";
        emailInput.value = "";
        passwordInput.value = "";
        usernameInput.value = "";
        setMode("login");
      } catch (error) {
        chatError.textContent = error.message;
      }
    });

    async function startApp() {
      try {
        const data = await api("/api/me");
        if (data.authenticated && data.user) {
          await enterChat(data.user);
        }
      } catch {
        // Se não houver sessão válida, a tela de login permanece aberta.
      }
    }

    startApp();
  </script>
</body>
</html>
