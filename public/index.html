
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111b">
  <title>NEXO — Conecte-se</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #10111b;
      color: #f5f6ff;
      font-family: Arial, sans-serif;
      height: 100dvh;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      background: #171824;
      min-height: 0;
    }

    header {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #292a3b;
      background: #191a29;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 22px;
      background: linear-gradient(135deg, #8267ff, #36cfff);
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #a4a6bd;
      font-size: 12px;
      margin-top: 5px;
    }

    .status {
      margin-left: auto;
      color: #ffcc66;
      font-size: 12px;
    }

    .room {
      padding: 15px 18px;
      border-bottom: 1px solid #292a3b;
    }

    .room strong {
      font-size: 15px;
    }

    .room p {
      margin: 6px 0 0;
      color: #a4a6bd;
      font-size: 12px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .welcome {
      text-align: center;
      margin: auto 0;
      color: #a4a6bd;
      line-height: 1.7;
    }

    .welcome .symbol {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .message {
      background: #222435;
      border: 1px solid #303247;
      border-radius: 14px;
      padding: 12px 14px;
      max-width: 90%;
      overflow-wrap: anywhere;
      align-self: flex-start;
    }

    .message.mine {
      align-self: flex-end;
      background: #34305e;
      border-color: #51468c;
    }

    .author {
      color: #9c9aff;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .content {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .time {
      color: #a4a6bd;
      font-size: 10px;
      margin-top: 7px;
      text-align: right;
    }

    .composer {
      padding: 14px;
      border-top: 1px solid #292a3b;
      display: flex;
      gap: 10px;
      background: #191a29;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 1px solid #36384e;
      border-radius: 13px;
      background: #222435;
      color: white;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #8270ff;
    }

    #sendButton {
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #8267ff, #6355db);
      color: white;
      padding: 0 19px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .45;
    }

    footer {
      padding: 9px;
      text-align: center;
      font-size: 11px;
      color: #777b96;
    }

    @media (max-width: 480px) {
      header {
        padding: 14px;
      }

      #messages {
        padding: 13px;
      }

      .composer {
        padding: 10px;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">N</div>
      <div>
        <h1>NEXO</h1>
        <div class="subtitle">Sua conexão começa aqui</div>
      </div>
      <div class="status" id="status">Conectando...</div>
    </header>

    <section class="room">
      <strong>🌐 Chat global</strong>
      <p>Converse com quem estiver conectado ao NEXO.</p>
    </section>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="symbol">✦</div>
        <strong>Bem-vindo ao NEXO</strong>
        <div>Envie sua primeira mensagem para começar.</div>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="Escreva uma mensagem..."
        autocomplete="off"
        aria-label="Sua mensagem"
        required
      >
      <button id="sendButton" type="submit" disabled>
        Enviar
      </button>
    </form>

    <footer>NEXO © 2026 · Conectando pessoas</footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    let socket = null;
    const clientId =
      sessionStorage.getItem("nexoClientId") ||
      (crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random());

    sessionStorage.setItem("nexoClientId", clientId);

    function updateStatus(connected) {
      statusEl.textContent = connected
        ? "● Online"
        : "● Reconectando...";
      statusEl.style.color = connected ? "#65e6a5" : "#ffcc66";
      sendButton.disabled = !connected;
    }

    function addMessage(data) {
      if (!data || typeof data.message !== "string") return;

      welcomeEl?.remove();

      const box = document.createElement("div");
      box.className =
        "message" + (data.clientId === clientId ? " mine" : "");

      const author = document.createElement("div");
      author.className = "author";
      author.textContent =
        data.clientId === clientId ? "Você" : "Membro do NEXO";

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = data.message;

      const time = document.createElement("div");
      time.className = "time";
      const date = new Date(data.time);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
          });

      box.append(author, content, time);
      messagesEl.appendChild(box);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function connectChat() {
      if (typeof io !== "function") {
        statusEl.textContent = "Erro ao carregar o chat";
        statusEl.style.color = "#ff7777";
        return;
      }

      socket = io();

      socket.on("connect", () => {
        updateStatus(true);
      });

      socket.on("disconnect", () => {
        updateStatus(false);
      });

      socket.on("connect_error", (error) => {
        console.error("Erro de conexão:", error.message);
        updateStatus(false);
      });

      socket.on("chat message", (data) => {
        addMessage(data);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || !socket || !socket.connected) return;

      socket.emit("chat message", {
        message,
        clientId
      });

      input.value = "";
      input.focus();
    });

    connectChat();
  </script>
</body>
</html>
